<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="340" fill="none">
  <style>
    .bg { fill: #f8fafc; stroke: #e2e8f0; }
    .card { fill: #ffffff; stroke: #cbd5e1; }
    .card-accent { fill: #f0fdf4; stroke: #10b981; }
    .card-kernel { fill: #eff6ff; stroke: #3b82f6; }
    .pill { fill: #f1f5f9; stroke: #cbd5e1; }
    .pill-green { fill: #dcfce7; stroke: #86efac; }
    .pill-blue { fill: #dbeafe; stroke: #93c5fd; }
    .title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; }
    .subtitle { fill: #334155; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; }
    .muted { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .mono { fill: #0f766e; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 600; }
    .mono-blue { fill: #1d4ed8; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 600; }
    .connector { stroke: #94a3b8; stroke-dasharray: 4 3; }
    .connector-solid { stroke: #10b981; }
    .dot-green { fill: #10b981; }
    .dot-blue { fill: #3b82f6; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #090d16; stroke: #1e293b; }
      .card { fill: #0f172a; stroke: #334155; }
      .card-accent { fill: #062019; stroke: #059669; }
      .card-kernel { fill: #0b192c; stroke: #2563eb; }
      .pill { fill: #1e293b; stroke: #334155; }
      .pill-green { fill: #064e3b; stroke: #059669; }
      .pill-blue { fill: #1e3a8a; stroke: #3b82f6; }
      .title { fill: #f8fafc; }
      .subtitle { fill: #e2e8f0; }
      .muted { fill: #94a3b8; }
      .mono { fill: #34d399; }
      .mono-blue { fill: #60a5fa; }
      .connector { stroke: #475569; }
      .connector-solid { stroke: #34d399; }
      .dot-green { fill: #34d399; }
      .dot-blue { fill: #60a5fa; }
    }
  </style>

  <!-- Outer Frame -->
  <rect class="bg" x="4" y="4" width="912" height="332" rx="14" stroke-width="1.5"/>

  <!-- Header Bar -->
  <text class="title" x="28" y="34" font-size="14" letter-spacing="0.4">HEURION ECOSYSTEM ARCHITECTURE · 契约受控临床科研工作台与事务型 Agent 操作系统</text>
  <circle class="dot-green" cx="810" cy="29" r="4"/>
  <text class="mono" x="820" y="33" font-size="11">AAP-1.0 · MCP · A2A</text>

  <!-- LAYER 1: APPLICATION & CLINICAL LAYER -->
  <rect class="card-accent" x="24" y="48" width="872" height="122" rx="10" stroke-width="1.5"/>
  <text class="mono" x="42" y="70" font-size="11">APPLICATION LAYER · heurion-org/heurion (Heurion 2.0 &amp; OmniCanvas)</text>
  <text class="muted" x="505" y="70" font-size="11">Contract-Guarded Dual-Surface Clinical Research Workstation</text>

  <!-- 4 Pillar Boxes inside Layer 1 -->
  <rect class="card" x="40" y="82" width="202" height="74" rx="8" stroke-width="1"/>
  <text class="subtitle" x="52" y="102" font-size="12">1. Dual-Surface CRDT Core</text>
  <text class="muted" x="52" y="120" font-size="10.5">ProseMirror + Yjs · Stable {#id}</text>
  <text class="muted" x="52" y="136" font-size="10.5">Byte-Preserving .docx/.pptx</text>
  <text class="mono" x="52" y="150" font-size="9.5">0.128ms Per-Turn AI Rollback</text>

  <rect class="card" x="252" y="82" width="202" height="74" rx="8" stroke-width="1"/>
  <text class="subtitle" x="264" y="102" font-size="12">2. Citation &amp; Evidence Loop</text>
  <text class="muted" x="264" y="120" font-size="10.5">PubMed · Europe PMC · OpenAlex</text>
  <text class="muted" x="264" y="136" font-size="10.5">Pre-Write Bare DOI/PMID Block</text>
  <text class="mono" x="264" y="150" font-size="9.5">4-Way Claim Verification</text>

  <rect class="card" x="464" y="82" width="202" height="74" rx="8" stroke-width="1"/>
  <text class="subtitle" x="476" y="102" font-size="12">3. Clinical &amp; PHI Governance</text>
  <text class="muted" x="476" y="120" font-size="10.5">2-Stage PHI Funnel (98.6% Recall)</text>
  <text class="muted" x="476" y="136" font-size="10.5">Table 1 · KM · CONSORT · E-Value</text>
  <text class="mono" x="476" y="150" font-size="9.5">MONAI 3D · PHR Read-Only Guard</text>

  <rect class="card" x="676" y="82" width="204" height="74" rx="8" stroke-width="1"/>
  <text class="subtitle" x="688" y="102" font-size="12">4. 3-Layer Evolving Memory</text>
  <text class="muted" x="688" y="120" font-size="10.5">Dry-Run Probes (doc_validate)</text>
  <text class="muted" x="688" y="136" font-size="10.5">Orthogonal Declarative/Procedural</text>
  <text class="mono" x="688" y="150" font-size="9.5">-49% Guard Rejections (Ablation)</text>

  <!-- PROTOCOL BRIDGE -->
  <line class="connector-solid" x1="230" y1="170" x2="230" y2="202" stroke-width="1.75"/>
  <line class="connector-solid" x1="460" y1="170" x2="460" y2="202" stroke-width="1.75"/>
  <line class="connector-solid" x1="690" y1="170" x2="690" y2="202" stroke-width="1.75"/>

  <rect class="pill-green" x="95" y="176" width="270" height="20" rx="10" stroke-width="1"/>
  <text class="mono" x="112" y="190" font-size="10">Model Context Protocol (65+ MCP Tools)</text>

  <rect class="pill" x="378" y="176" width="164" height="20" rx="10" stroke-width="1"/>
  <text class="subtitle" x="392" y="190" font-size="10">AAP-1.0 Ed25519 Leases</text>

  <rect class="pill-blue" x="555" y="176" width="270" height="20" rx="10" stroke-width="1"/>
  <text class="mono-blue" x="572" y="190" font-size="10">Google A2A Protocol &amp; CAS Artifact Bus</text>

  <!-- LAYER 2: AGENT OS KERNEL LAYER -->
  <rect class="card-kernel" x="24" y="202" width="872" height="118" rx="10" stroke-width="1.5"/>
  <text class="mono-blue" x="42" y="224" font-size="11">RUNTIME KERNEL LAYER · heurion-org/aegis-os (Aegis OS Runtime &amp; Cloud PaaS)</text>
  <text class="muted" x="515" y="224" font-size="11">Transactional Multi-Tenant OS Runtime for Autonomous Agents</text>

  <rect class="card" x="40" y="234" width="202" height="72" rx="8" stroke-width="1"/>
  <text class="subtitle" x="52" y="254" font-size="12">Transactional CoW VFS</text>
  <text class="muted" x="52" y="271" font-size="10.5">APFS clonefile (6.3ms) · FICLONE</text>
  <text class="muted" x="52" y="287" font-size="10.5">4-Tier LCS Diff3 Auto-Rebase</text>
  <text class="mono-blue" x="52" y="300" font-size="9.5">aos-vfs · Pre-Commit verify_cmd</text>

  <rect class="card" x="252" y="234" width="202" height="72" rx="8" stroke-width="1"/>
  <text class="subtitle" x="264" y="254" font-size="12">Dual-Tier Kernel Sandbox</text>
  <text class="muted" x="264" y="271" font-size="10.5">macOS Seatbelt · Linux Bubblewrap</text>
  <text class="muted" x="264" y="287" font-size="10.5">Default-Deny $HOME Isolation</text>
  <text class="mono-blue" x="264" y="300" font-size="9.5">aos-sandbox · 0.0% ASR (80/80)</text>

  <rect class="card" x="464" y="234" width="202" height="72" rx="8" stroke-width="1"/>
  <text class="subtitle" x="476" y="254" font-size="12">Zero-Trust Egress &amp; DLP</text>
  <text class="muted" x="476" y="271" font-size="10.5">L7 Method/Path $AOS_SECRET_*</text>
  <text class="muted" x="476" y="287" font-size="10.5">Outbound Credential/Token DLP</text>
  <text class="mono-blue" x="476" y="300" font-size="9.5">aos-egress · Confused-Deputy Safe</text>

  <rect class="card" x="676" y="234" width="204" height="72" rx="8" stroke-width="1"/>
  <text class="subtitle" x="688" y="254" font-size="12">5-Stage Policy &amp; A2A IPC</text>
  <text class="muted" x="688" y="271" font-size="10.5">Cedar-Inspired R0a–R4 Policy</text>
  <text class="muted" x="688" y="287" font-size="10.5">-90.7% to -97.9% Auth Prompts</text>
  <text class="mono-blue" x="688" y="300" font-size="9.5">aos-policy · aos-ipc (1.12% IPR)</text>
</svg>
